    <meta name="description" content="TrustShield 254 helps you spot suspicious SMS messages, links and offers before you pay." />
    <meta name="theme-color" content="#10243a" />
    <title>TrustShield 254 | Verify before you pay</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('ts254.theme') || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
