services:
  # Django backend
  - type: web
    name: trustshield-backend
    runtime: python
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://trustshield-frontend.onrender.com"
      - key: ML_PRELOAD
        value: "true"
      - key: ML_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: trustshield-db
          property: connectionString

  # React/Vite frontend
  - type: web
    name: trustshield-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "bash build.sh"
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_API_BASE_URL
        value: "https://trustshield-backend.onrender.com/api"
      - key: VITE_API_PROXY_TARGET
        value: "https://trustshield-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: trustshield-db
    databaseName: trustshield
    user: trustshield
    plan: free